# Intake Last playbook: vendor / SaaS agreements where WE are the customer.
#
# Positions drafted by Claude and reviewed by the playbook owner on 2026-10-17 (spend
# escalation lowered to $250k, service warranty added; everything else confirmed as drafted).
# Governing law is deliberately not covered. Automated first-pass redlines, not legal advice.
#
# Two parts:
#
#   questions:  the intake questions the business user answers at download time.
#               Plain business language, no legal terms. Each answer can carry an
#               `escalate` message, which tells the user a lawyer must look before signing.
#               `show_if` hides a question unless earlier answers match.
#               `default` is the answer assumed when a question is hidden.
#
#   positions:  what the reviewer does to the contract. Each position covers one topic
#               and lists `cases`. The first case whose `when` matches the user's answers
#               wins. A case with no `when` is the fallback and must come last.
#               Every distinct case is reviewed against the contract up front (one
#               "variant" each), before anyone answers anything.
#
#               A case is either:
#                 accept: true        leave the contract alone on this topic
#                 position: ...       the standard the reviewer enforces
#                 fallback: ...       (optional) what the reviewer may settle for if the
#                                     contract is close but not at the standard
#                 language: ...       (optional) preferred clause text to start from
#
# Questions that cannot change the delivered contract (every answer produces the same
# redline) are skipped automatically, unless one of their answers escalates.

name: Vendor / SaaS agreement
party: Customer
counterparty: Vendor

questions:
  - id: spend
    ask: About how much will we pay this vendor per year?
    why: Bigger deals get stronger protections, and the biggest ones need a lawyer's eyes.
    answers:
      - { id: under_25k, label: "Under $25,000" }
      - { id: 25k_100k, label: "$25,000 to $100,000" }
      - { id: 100k_250k, label: "$100,000 to $250,000" }
      - id: over_250k
        label: "Over $250,000"
        escalate: Deals over $250,000 per year need a lawyer to review before signing. Send this redline to Legal along with your answers.

  - id: data
    ask: What kind of our information will the vendor be able to see or store?
    why: The more sensitive the information, the more the vendor has to promise to protect it.
    answers:
      - { id: none, label: "None. They never touch our data." }
      - { id: business, label: "Business information only (plans, financials, documents), no personal info" }
      - { id: personal, label: "Personal info about customers or employees (names, emails, account details)" }
      - id: sensitive
        label: "Sensitive personal info (health, financial account, government ID, children's data)"
        escalate: Sensitive personal information requires Privacy review before signing. Send this redline to the Privacy team.

  - id: ai
    ask: Does the product use AI or machine learning on the information we give it?
    why: Some vendors use customer data to train their AI. We need to know whether to shut that off.
    show_if: { data: [business, personal, sensitive] }
    default: "no"
    answers:
      - { id: "yes", label: "Yes" }
      - { id: "no", label: "No" }
      - { id: unsure, label: "Not sure" }

  - id: commitment
    ask: Is this a trial or pilot, or something we plan to keep using?
    why: Pilots should be easy to walk away from. Long-term tools need price protection.
    answers:
      - { id: pilot, label: "Trial or pilot (we may stop after a few months)" }
      - { id: ongoing, label: "Ongoing. We expect to use it for a year or more." }

  - id: critical
    ask: If this product went down for a day, what would happen?
    why: Products our customers or operations depend on need uptime commitments.
    answers:
      - { id: inconvenient, label: "Inconvenient, but we would manage" }
      - { id: critical, label: "Customers would notice, or a core operation would stop" }

positions:
  - id: liability_cap
    topic: Limitation of liability
    cases:
      - when: { spend: [under_25k], data: [none, business] }
        position: Each party's liability cap must be mutual and at least the fees paid or payable in the 12 months before the claim. Breach of confidentiality, indemnification obligations, and gross negligence or willful misconduct are excluded from the cap.
        fallback: Accept a cap of fees paid in the prior 12 months if the carve-outs are present. A cap below 12 months of fees is not acceptable.
      - when: { data: [none, business] }
        position: Each party's liability cap must be mutual and the greater of (a) fees paid or payable in the 12 months before the claim and (b) $250,000. Breach of confidentiality, indemnification obligations, and gross negligence or willful misconduct are excluded from the cap.
        fallback: Accept 12 months of fees without the dollar floor if the carve-outs are present.
      - when: { spend: [under_25k, 25k_100k] }
        position: Each party's liability cap must be mutual and the greater of (a) fees paid or payable in the 12 months before the claim and (b) $500,000. Vendor's liability for data breaches and breach of its data protection obligations is subject to a separate cap of the greater of 3x that amount and $1,000,000. Breach of confidentiality, indemnification obligations, and gross negligence or willful misconduct are excluded from the cap.
        fallback: Accept a data breach super cap of 2x the general cap.
      - position: Each party's liability cap must be mutual and the greater of (a) 2x the fees paid or payable in the 12 months before the claim and (b) $1,000,000. Vendor's liability for data breaches and breach of its data protection obligations is subject to a separate cap of the greater of 3x that amount and $5,000,000. Breach of confidentiality, indemnification obligations, and gross negligence or willful misconduct are excluded from the cap.
        fallback: Accept a general cap of 12 months of fees with a $1,000,000 floor if the data breach super cap stays.

  - id: data_protection
    topic: Data protection and security
    cases:
      - when: { data: [none] }
        accept: true
      - when: { data: [business] }
        position: Vendor must protect Customer's information with administrative, physical, and technical safeguards consistent with industry standards (for example SOC 2 Type II or ISO 27001), use it only to provide the services, and return or delete it within 30 days after the agreement ends.
        language: Vendor shall maintain administrative, physical, and technical safeguards consistent with industry standards (such as SOC 2 Type II or ISO 27001) designed to protect Customer Data against unauthorized access, use, or disclosure. Vendor shall use Customer Data solely to provide the Services to Customer and shall return or securely delete all Customer Data within thirty (30) days after termination or expiration of this Agreement.
      - position: Vendor must sign Customer's data processing addendum (or one meeting the same standard) before processing any personal information, maintain industry-standard security (SOC 2 Type II or ISO 27001), notify Customer of any security breach affecting Customer Data within 72 hours of discovery, use personal information only to provide the services, flow these obligations down to subprocessors, and return or delete all Customer Data within 30 days after the agreement ends.
        fallback: Accept Vendor's own DPA if it includes the 72 hour breach notice and the subprocessor flow-down.
        language: Vendor shall process personal information contained in Customer Data only in accordance with the Data Processing Addendum attached as Exhibit [__], which the parties shall execute concurrently with this Agreement. Vendor shall maintain administrative, physical, and technical safeguards consistent with industry standards (such as SOC 2 Type II or ISO 27001), shall notify Customer in writing without undue delay and in any event within seventy-two (72) hours after discovering any unauthorized access to or acquisition of Customer Data, and shall return or securely delete all Customer Data within thirty (30) days after termination or expiration of this Agreement.

  - id: ai_training
    topic: Use of our data to train AI or improve the product
    cases:
      - when: { data: [none] }
        accept: true
      - when: { ai: ["no"] }
        position: Vendor may not use Customer Data for any purpose other than providing the services to Customer. Delete or narrow any right for Vendor to use Customer Data to improve its products. Aggregated usage statistics that cannot identify Customer or any individual are acceptable.
      - position: Vendor may not use Customer Data, inputs, or outputs to train, fine-tune, or improve any artificial intelligence or machine learning model, or to improve its products, except for models used solely to provide the services to Customer. Customer owns its inputs and outputs. Aggregated usage statistics that cannot identify Customer or any individual are acceptable.
        language: Vendor shall not use Customer Data, including any inputs submitted to or outputs generated by the Services, to train, fine-tune, or otherwise improve any artificial intelligence or machine learning model, other than models used solely to provide the Services to Customer. As between the parties, Customer owns all inputs and outputs.

  - id: renewal
    topic: Term, renewal, and termination for convenience
    cases:
      - when: { commitment: [pilot] }
        position: No automatic renewal. Customer may terminate for convenience on 30 days' written notice, with a refund of any prepaid fees for the period after termination.
        fallback: Automatic renewal is acceptable only if Customer can cancel on 30 days' notice before renewal and terminate for convenience during the initial term.
      - position: Automatic renewal is acceptable if renewal terms are no longer than 12 months and Customer can opt out with written notice at least 30 days before the renewal date. Vendor must send a renewal reminder at least 60 days before the renewal date.
        fallback: Accept a 60 day opt-out notice period if the reminder obligation stays.

  - id: price_increase
    topic: Price increases
    cases:
      - when: { commitment: [pilot] }
        position: Fees are fixed for the term. Delete any right for Vendor to raise fees during the term.
      - position: Fees are fixed for the initial term. On renewal, increases are limited to the lesser of 5% and the change in CPI-U over the prior 12 months, with at least 60 days' written notice.
        fallback: Accept a cap of 7% per renewal.

  - id: service_levels
    topic: Uptime and service levels
    cases:
      - when: { critical: [inconvenient] }
        accept: true
      - position: Vendor must commit to at least 99.9% monthly uptime (excluding scheduled maintenance announced in advance), provide service credits when it misses, and allow Customer to terminate without penalty and receive a refund of prepaid fees if uptime falls below the commitment in any three months within a 12 month period.
        fallback: Accept 99.5% uptime if the chronic failure termination right stays.
        language: Vendor shall make the Services available at least 99.9% of the time in each calendar month, excluding scheduled maintenance of which Vendor gives Customer at least 48 hours' notice. If Vendor fails to meet this commitment in any month, Customer shall receive a service credit of 10% of that month's fees for each full percentage point below the commitment. If Vendor fails to meet this commitment in any three (3) months within a twelve (12) month period, Customer may terminate this Agreement without penalty and receive a refund of all prepaid fees for the period after termination.

  # Positions with a single case and no `when` apply to every contract.
  - id: service_warranty
    topic: Service warranty
    cases:
      - position: Vendor must warrant that the services will perform materially in accordance with its documentation during the term. If they do not, Vendor must correct the nonconformity, and if it cannot do so within 30 days of notice, Customer may terminate and receive a refund of prepaid fees for the period after termination. Vendor's general disclaimer of other warranties may otherwise stay.
        language: Vendor warrants that the Services will perform materially in accordance with the applicable documentation during the term. If the Services do not conform to this warranty, Vendor shall correct the nonconformity at no charge, and if Vendor fails to do so within thirty (30) days after Customer's written notice, Customer may terminate this Agreement and receive a refund of all prepaid fees for the period after termination.

  - id: unilateral_changes
    topic: Vendor changing the terms
    cases:
      - position: Vendor may not change the agreement, including any policies or terms incorporated by URL, without Customer's written agreement. Any incorporated online terms are fixed as of the effective date. Delete any right to modify terms by posting updates.

  - id: ip_indemnity
    topic: IP infringement indemnity
    cases:
      - position: Vendor must defend and indemnify Customer against third-party claims that the services infringe or misappropriate intellectual property rights, with the usual exceptions (Customer modifications, combinations not provided by Vendor, Customer's own content).
        language: Vendor shall defend Customer and its affiliates, officers, and employees against any third-party claim alleging that the Services infringe or misappropriate any patent, copyright, trademark, or trade secret, and shall pay all damages, costs, and reasonable attorneys' fees finally awarded or agreed in settlement. Vendor has no obligation under this Section to the extent a claim arises from Customer's modification of the Services, combination of the Services with items not provided by Vendor, or Customer Data.

  - id: publicity
    topic: Publicity and use of our name
    cases:
      - position: Vendor may not use Customer's name, logo, or trademarks, or identify Customer as a customer, without Customer's prior written consent.
